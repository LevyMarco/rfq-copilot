<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="200" fill="#0f1115" rx="8"/>
  <g font-size="12">
    <rect x="20"  y="60" width="130" height="62" rx="8" fill="#171a21" stroke="#2a2f3a"/>
    <text x="85"  y="86"  fill="#8b93a3" text-anchor="middle">RFQ email</text>
    <text x="85"  y="104" fill="#e6e8ec" text-anchor="middle" font-size="11">free-form text</text>

    <rect x="190" y="60" width="130" height="62" rx="8" fill="#171a21" stroke="#4f8cff"/>
    <text x="255" y="84"  fill="#4f8cff" text-anchor="middle" font-weight="600">1 · EXTRACT</text>
    <text x="255" y="104" fill="#8b93a3" text-anchor="middle" font-size="11">LLM + baseline</text>

    <rect x="360" y="60" width="130" height="62" rx="8" fill="#171a21" stroke="#4f8cff"/>
    <text x="425" y="84"  fill="#4f8cff" text-anchor="middle" font-weight="600">2 · MATCH</text>
    <text x="425" y="104" fill="#8b93a3" text-anchor="middle" font-size="11">explainable score</text>

    <rect x="530" y="60" width="130" height="62" rx="8" fill="#171a21" stroke="#4f8cff"/>
    <text x="595" y="84"  fill="#4f8cff" text-anchor="middle" font-weight="600">3 · PRICE</text>
    <text x="595" y="104" fill="#8b93a3" text-anchor="middle" font-size="11">deterministic</text>

    <rect x="700" y="60" width="150" height="62" rx="8" fill="#171a21" stroke="#3fb950"/>
    <text x="775" y="84"  fill="#3fb950" text-anchor="middle" font-weight="600">HUMAN REVIEW</text>
    <text x="775" y="104" fill="#8b93a3" text-anchor="middle" font-size="11">correct · export</text>

    <g stroke="#2a2f3a" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <path d="M150 91 H186"/><path d="M320 91 H356"/><path d="M490 91 H526"/><path d="M660 91 H696"/>
    </g>

    <path d="M775 122 V158 H425 V126" stroke="#d29922" stroke-width="1.5" fill="none"
          stroke-dasharray="5 4" marker-end="url(#b)"/>
    <text x="600" y="176" fill="#d29922" text-anchor="middle" font-size="11">
      corrections become learned aliases, applied to the next quote
    </text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2a2f3a"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#d29922"/></marker>
  </defs>
</svg>
